
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#54266F">
<title>How Dare You!</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100svh;
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 22px;

  background:
    linear-gradient(rgba(255,255,255,0.06),rgba(35,0,65,0.08)),
    url("background.png") center center / cover no-repeat;

  font-family: Georgia, "Times New Roman", serif;
}

.container {
  width: 100%;
  max-width: 450px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;

  animation: entrance 1s ease both;
}

.gif-frame {
  width: 100%;
  max-width: 380px;
  overflow: hidden;

  border: 3px solid #b98748;
  border-radius: 22px;

  background: rgba(255,255,255,0.2);

  box-shadow:
    0 0 0 5px rgba(255,255,255,0.4),
    0 15px 35px rgba(35,0,45,0.4),
    0 0 22px rgba(255,220,160,0.4);
}

.gif-frame img {
  display: block;
  width: 100%;
  height: auto;
}

.back-button,
.music-button {
  min-width: 170px;
  padding: 15px 25px;

  border: 2px solid #d5ad70;
  border-radius: 16px;

  background: linear-gradient(
    145deg,
    #c39454,
    #754C24 48%,
    #48270f
  );

  color: #FFFFFF;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 1px;

  text-shadow: 0 2px 3px rgba(0,0,0,0.5);

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.4),
    inset 0 -4px 5px rgba(0,0,0,0.25),
    0 7px 0 #39200e,
    0 13px 25px rgba(30,10,0,0.35);

  cursor: pointer;
  transition: transform 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.back-button:active,
.music-button:active {
  transform: translateY(6px) scale(0.96);
}

.music-button {
  display: none;
  font-size: 16px;
  min-width: 190px;
}

@keyframes entrance {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="gif-frame">
    <img src="cat.gif" alt="Funny cat GIF">
  </div>

  <button
    class="back-button"
    onclick="location.href='page3.html'">
    ← BACK
  </button>

  <audio id="music" src="no-music.mp3" loop preload="auto"></audio>

  <button
    id="musicButton"
    class="music-button"
    onclick="playMusic()">
    ▶ PLAY MUSIC 🎵
  </button>

</main>

<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

function playMusic() {
  music.play()
    .then(() => {
      musicButton.style.display = "none";
    })
    .catch(() => {
      musicButton.style.display = "block";
    });
}

window.addEventListener("load", () => {
  playMusic();
});
</script>

</body>
</html>
